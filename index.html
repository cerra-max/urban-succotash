<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>无边记 · 思维画布</title>
<style>
:root{
  --ui-bg:rgba(255,255,255,.86);--ui-solid:#fff;--ui-border:rgba(0,0,0,.08);--ui-text:#1d1d1f;--ui-sub:#6e6e73;
  --canvas:#f5f5f7;--dot:#cfd0d6;--ink:#1d1d1f;--line:#8e8e93;--root:#2e3440;--accent:#0a84ff;
  --hover:rgba(0,0,0,.055);--shadow:0 8px 28px rgba(0,0,0,.10),0 1px 3px rgba(0,0,0,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --ui-bg:rgba(44,44,48,.86);--ui-solid:#2c2c30;--ui-border:rgba(255,255,255,.10);--ui-text:#f5f5f7;--ui-sub:#a1a1a6;
    --canvas:#1c1c1e;--dot:#3a3a3e;--ink:#f2f2f7;--line:#98989d;--root:#eceef3;--accent:#0a84ff;
    --hover:rgba(255,255,255,.08);--shadow:0 8px 28px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--canvas);color:var(--ui-text);
  font:13px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
#stage{position:fixed;inset:0;overflow:hidden}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#items text{pointer-events:none}
.tog{opacity:0;cursor:pointer;transition:opacity .12s}
.mnode:hover .tog,.tog.on{opacity:1}
[data-handle]{cursor:nwse-resize}
[data-handle=n],[data-handle=s]{cursor:ns-resize}
[data-handle=e],[data-handle=w]{cursor:ew-resize}
[data-handle=ne],[data-handle=sw]{cursor:nesw-resize}
[data-handle=from],[data-handle=to]{cursor:move}
#stage[data-tool=hand] #canvas,#stage.space #canvas{cursor:grab}
#stage.grabbing #canvas{cursor:grabbing!important}
#stage[data-tool=pen] #canvas,#stage[data-tool=line] #canvas,#stage[data-tool=sticky] #canvas,
#stage[data-tool=shape] #canvas,#stage[data-tool=mind] #canvas{cursor:crosshair}
#stage[data-tool=text] #canvas{cursor:text}
#stage[data-tool=eraser] #canvas{cursor:cell}

.panel{background:var(--ui-bg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border:1px solid var(--ui-border);box-shadow:var(--shadow);border-radius:12px}
#topbar{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:10}
#topbar>*{pointer-events:auto}
.group{display:flex;align-items:center;gap:2px;padding:4px}
.btn{width:34px;height:34px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;cursor:pointer;position:relative;padding:0;flex:none}
.btn:hover{background:var(--hover)}
.btn.active{background:var(--accent);color:#fff}
.btn:disabled{opacity:.3;cursor:default;background:transparent}
.btn svg,.ib svg,.mi svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sep{width:1px;height:20px;background:var(--ui-border);margin:0 4px;flex:none}
#topbar [data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;
  background:#1d1d1f;color:#fff;padding:4px 8px;border-radius:6px;font-size:12px;pointer-events:none;z-index:50}
#title{border:0;background:transparent;font-weight:600;font-size:14px;color:var(--ui-text);width:170px;padding:6px 8px;border-radius:6px;outline:none;font-family:inherit}
#title:focus{background:var(--hover)}
#status{color:var(--ui-sub);font-size:12px;padding:0 8px 0 2px;white-space:nowrap}
#tools{flex:none}
.menuwrap{position:relative}
.menu{position:absolute;top:calc(100% + 8px);right:0;min-width:230px;padding:6px;display:none;z-index:60;background:var(--ui-solid)}
.menu.open{display:block}
.mi{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}
.mi:hover{background:var(--accent);color:#fff}
.mi:hover kbd{color:rgba(255,255,255,.8)}
.mi kbd{margin-left:auto;font:12px -apple-system,sans-serif;color:var(--ui-sub)}
.msep{height:1px;background:var(--ui-border);margin:5px 4px}

#insp{position:fixed;display:flex;flex-wrap:wrap;row-gap:4px;align-items:center;padding:4px;z-index:9;left:0;top:0;white-space:nowrap;max-width:calc(100vw - 16px)}
#insp[hidden]{display:none}
.ig{display:flex;align-items:center;gap:2px;padding:0 5px;border-left:1px solid var(--ui-border)}
.ig:first-child{border-left:0}
.sw{width:20px;height:20px;border-radius:50%;border:1px solid rgba(128,128,128,.35);background:var(--c);cursor:pointer;margin:0 2px;padding:0;flex:none}
.sw.auto{background:conic-gradient(var(--ink) 0 50%,var(--canvas) 0)}
.sw.on{box-shadow:0 0 0 2px var(--ui-solid),0 0 0 4px var(--accent)}
.ib{height:30px;min-width:30px;padding:0 6px;border:0;border-radius:7px;background:transparent;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:1px;flex:none}
.ib:hover{background:var(--hover)}
.ib.on{background:var(--accent);color:#fff}
.ib b{font-weight:800}
.wdot{display:block;border-radius:50%;background:currentColor}
.popw{position:relative;display:inline-flex}
.pop{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);padding:6px;min-width:180px;z-index:12;background:var(--ui-solid)}
.mi.cur{color:var(--accent)}
.mi.cur:hover{color:#fff}

#zoombar{position:fixed;right:12px;bottom:12px;display:flex;align-items:center;padding:4px;z-index:10}
#zoomPct{width:58px;height:34px;border:0;background:transparent;border-radius:8px;cursor:pointer;font-variant-numeric:tabular-nums}
#zoomPct:hover{background:var(--hover)}

#sidebar{position:fixed;top:64px;left:12px;bottom:12px;width:264px;z-index:11;display:flex;flex-direction:column;
  transform:translateX(calc(-100% - 20px));transition:transform .22s ease;padding:10px}
#sidebar.open{transform:none}
.sbhead{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 8px}
.sbhead h3{margin:0;font-size:13px;font-weight:600;color:var(--ui-sub)}
#boardList{overflow:auto;flex:1;display:flex;flex-direction:column;gap:4px;margin:0 -4px;padding:0 4px}
.card{padding:7px;border-radius:10px;cursor:pointer;position:relative}
.card:hover{background:var(--hover)}
.card.on{background:var(--hover);box-shadow:inset 0 0 0 2px var(--accent)}
.thumb{aspect-ratio:16/10;border-radius:7px;background:var(--canvas);border:1px solid var(--ui-border);overflow:hidden;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:contain}
.cmeta{display:flex;align-items:center;gap:6px;padding:6px 2px 0}
.cname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ctime{color:var(--ui-sub);font-size:11px;white-space:nowrap}
.cdel{opacity:0;border:0;background:transparent;width:24px;height:24px;border-radius:6px;cursor:pointer;display:grid;place-items:center;padding:0}
.cdel svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card:hover .cdel{opacity:.7}.cdel:hover{opacity:1!important;background:var(--hover);color:#f25c54}

#editor{position:absolute;display:none;margin:0;padding:0;border:0;outline:none;background:transparent;resize:none;overflow:hidden;z-index:5;
  caret-color:var(--accent);white-space:pre-wrap;overflow-wrap:break-word;user-select:text;-webkit-user-select:text;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif}
#editor.nowrap{white-space:pre}
#empty{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--ui-sub);font-size:15px;text-align:center;line-height:2}
#empty[hidden]{display:none}
#empty kbd,.help kbd{display:inline-block;min-width:22px;padding:0 6px;border:1px solid var(--ui-border);border-bottom-width:2px;border-radius:5px;
  font:12px/20px -apple-system,sans-serif;background:var(--ui-solid);color:var(--ui-text);text-align:center}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,16px);opacity:0;transition:.2s;padding:9px 16px;z-index:70;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#help{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;place-items:center;z-index:80}
#help.open{display:grid}
.help{width:min(760px,92vw);max-height:86vh;overflow:auto;padding:22px 26px;background:var(--ui-solid)}
.help h2{margin:0 0 4px;font-size:18px}
.help p{color:var(--ui-sub);margin:0 0 14px}
.help h4{margin:14px 0 6px;font-size:13px;color:var(--ui-sub)}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px}
.hrow{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px solid var(--ui-border)}
.hrow span:last-child{white-space:nowrap}
#helpClose{position:sticky;float:right;top:0}
/* 多人协作 */
#avatars{display:flex;align-items:center;padding:0 2px 0 6px}
#avatars:empty{display:none}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;margin-left:-7px;
  box-shadow:0 0 0 2px var(--ui-solid);flex:none;cursor:default}
.av:first-child{margin-left:0}
.av.more{background:var(--hover);color:var(--ui-text);font-weight:500}
#shareBtn .sdot{position:absolute;right:4px;top:4px}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#8e8e93;flex:none}
.sdot.online{background:#34c759}.sdot.connecting,.sdot.offline{background:#ff9f0a}
#sharePop{position:fixed;top:62px;right:12px;width:330px;max-width:calc(100vw - 24px);min-width:0;padding:16px;cursor:default;user-select:none}
.sp h4{margin:0 0 4px;font-size:14px}
.sp p{margin:0 0 6px;color:var(--ui-sub);font-size:12px;line-height:1.5}
.sp code{font:12px ui-monospace,Menlo,monospace;background:var(--hover);padding:1px 5px;border-radius:4px;user-select:text;-webkit-user-select:text}
.sp label{display:block;font-size:12px;color:var(--ui-sub);margin:12px 0 5px}
.sp input{width:100%;min-width:0;height:30px;padding:0 9px;border:1px solid var(--ui-border);border-radius:7px;background:var(--canvas);color:var(--ui-text);
  font:inherit;outline:none;user-select:text;-webkit-user-select:text}
.sp input:focus{border-color:var(--accent)}
.sp .row{display:flex;gap:6px;align-items:center}
.sp .stat{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ui-sub);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pbtn{height:30px;padding:0 12px;border:0;border-radius:7px;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap;font-weight:500;flex:none}
.pbtn:hover{filter:brightness(1.08)}
.pbtn.sec{background:var(--hover);color:var(--ui-text)}
.pbtn.link{background:transparent;color:#f25c54;padding:0;height:auto;margin-top:14px}
.members{display:flex;flex-direction:column;gap:7px;max-height:180px;overflow:auto}
.mem{display:flex;align-items:center;gap:8px}
.mem .av{margin:0;width:22px;height:22px;font-size:11px;box-shadow:none}
.mem small{color:var(--ui-sub)}
#cursors{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.cur{position:absolute;left:0;top:0;transition:transform .06s linear;will-change:transform}
.cur svg{width:18px;height:18px;display:block}
.cur span{position:absolute;left:13px;top:15px;padding:2px 7px;border-radius:6px;color:#fff;font-size:12px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.cbadge{font-size:10px;padding:1px 5px;border-radius:4px;background:var(--accent);color:#fff;flex:none}
@media (max-width:980px){
  #tools{position:fixed;left:50%;bottom:12px;transform:translateX(-50%)}
  #topbar #tools [data-tip]:hover::after{top:auto;bottom:calc(100% + 8px)}
  #zoombar{bottom:66px}
  #status{display:none}
  #title{width:120px}
}
@media (max-width:560px){
  #zoombar{display:none} .btn{width:30px}
  #avatars{display:none}
  #title{width:96px}
}
</style>
</head>
<body>
<div id="stage" data-tool="select">
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="grid" patternUnits="userSpaceOnUse" width="24" height="24"><circle id="gridDot" cx="1.2" cy="1.2" r="1.1" style="fill:var(--dot)"/></pattern>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity=".16"/></filter>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid)"/>
    <g id="world"><g id="items"></g><g id="sel"></g></g>
  </svg>
  <textarea id="editor" spellcheck="false" autocomplete="off"></textarea>
  <div id="cursors"></div>
</div>

<div id="topbar">
  <div class="panel group">
    <button class="btn" id="sideBtn" data-tip="画板列表"></button>
    <input id="title" value="未命名画板" spellcheck="false">
    <span id="status"></span>
  </div>
  <div class="panel group" id="tools"></div>
  <div class="panel group">
    <div id="avatars"></div>
    <button class="btn" id="shareBtn" data-tip="多人协作"></button>
    <div class="sep"></div>
    <button class="btn" id="undoBtn" data-tip="撤销 ⌘Z"></button>
    <button class="btn" id="redoBtn" data-tip="重做 ⇧⌘Z"></button>
    <div class="sep"></div>
    <div class="menuwrap">
      <button class="btn" id="moreBtn" data-tip="更多"></button>
      <div class="menu panel" id="menu"></div>
    </div>
  </div>
</div>

<aside id="sidebar" class="panel">
  <div class="sbhead"><h3>我的画板</h3><button class="btn" id="newBoardBtn" title="新建画板"></button></div>
  <div id="boardList"></div>
</aside>

<div class="menu panel" id="sharePop"></div>
<div id="insp" class="panel" hidden></div>
<div id="zoombar" class="panel">
  <button class="btn" id="zoomOut" title="缩小 ⌘−"></button>
  <button id="zoomPct" title="缩放到 100% ⌘0">100%</button>
  <button class="btn" id="zoomIn" title="放大 ⌘+"></button>
  <div class="sep"></div>
  <button class="btn" id="zoomFit" title="适应画布 ⌘1"></button>
</div>
<div id="empty" hidden><div>双击空白处输入文字 · 按 <kbd>M</kbd> 再点击画布创建思维导图<br>按 <kbd>N</kbd> 便签 · <kbd>R</kbd> 形状 · <kbd>P</kbd> 画笔 · <kbd>?</kbd> 查看全部快捷键</div></div>
<div id="toast" class="panel"></div>
<div id="help"><div class="help panel" id="helpBody"></div></div>
<input type="file" id="fileOpen" accept=".wbj,.json,application/json" hidden>
<input type="file" id="fileImg" accept="image/*" multiple hidden>

<script>
'use strict';
// ============ 常量 ============
const $ = s => document.querySelector(s);
const FONT = `-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif`;
const LH = 1.35, PAD = 14;
const FILL = ['#FFE58F','#FFC59E','#FFB3BA','#E7C6FF','#A0C4FF','#9BF6D4','#C7F59B','#FFFFFF','#D1D1D6','#3A3A3C'];

const CLIPMARK = 'WBJCLIP:';
const TEXTUAL = new Set(['mind','sticky','shape','text','line']);
const STRUCTS = [['balance','平衡思维导图'],['right','向右逻辑图'],['left','向左逻辑图'],['org','组织结构图'],['tree','树形图'],['fishbone','鱼骨图']];
const structOf = n => n.structure || 'balance';
const RESIZABLE = new Set(['sticky','shape','image','text']);

const IC = {
  select:'<path d="M6 3.5l12.5 7.2-5.6 1.4-2.6 5.4z"/>',
  hand:'<path d="M8.5 12.5V5.8a1.4 1.4 0 012.8 0v5.7M11.3 11V4.4a1.4 1.4 0 012.8 0V11M14.1 11.2V5.9a1.4 1.4 0 012.8 0v7.4c0 3.9-2.5 6.7-6 6.7-2.3 0-3.7-1-5-3l-2.5-4a1.4 1.4 0 012.3-1.6l1.8 2.3"/>',
  mind:'<rect x="9" y="9.5" width="6" height="5" rx="1.5"/><path d="M15 12h2.5M17.5 6.5v11M17.5 6.5H21M17.5 17.5H21M9 12H6.5M6.5 8v8M6.5 8H3M6.5 16H3"/>',

  eraser:'<path d="M9 20h11"/><path d="M5 15.2l9.1-9.1a2 2 0 012.8 0l2 2a2 2 0 010 2.8L11 19.8H8.6z"/><path d="M9 11.2l4.6 4.6"/>',
  image:'<rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l4.5-4 3.5 3 3-2.6 5 4"/>',
  undo:'<path d="M9 14.5L4.5 10 9 5.5"/><path d="M4.5 10H15a4.5 4.5 0 010 9h-3"/>',
  redo:'<path d="M15 14.5l4.5-4.5L15 5.5"/><path d="M19.5 10H9a4.5 4.5 0 000 9h3"/>',
  more:'<circle cx="6" cy="12" r="1.1"/><circle cx="12" cy="12" r="1.1"/><circle cx="18" cy="12" r="1.1"/>',
  side:'<rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M9.5 5v14"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>',
  trash:'<path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/>',
  dup:'<rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V6a1 1 0 011-1h9"/>',
  front:'<rect x="8" y="8" width="11" height="11" rx="2" fill="currentColor" fill-opacity=".3"/><path d="M5 15V5h10"/>',
  back:'<rect x="5" y="5" width="11" height="11" rx="2" fill="currentColor" fill-opacity=".3"/><path d="M19 9v10H9"/>',
  child:'<rect x="3" y="9" width="7" height="6" rx="1.5"/><path d="M10 12h3M13 7v10M13 7h3M13 17h2"/><path d="M19 14.5v5M16.5 17h5"/>',
  sib:'<rect x="5" y="4" width="11" height="6" rx="1.5"/><rect x="5" y="14" width="11" height="6" rx="1.5" stroke-dasharray="2 2"/><path d="M19 15v4M17 17h4"/>',
  fold:'<circle cx="12" cy="12" r="8"/><path d="M8.5 12h7"/>',
  unfold:'<circle cx="12" cy="12" r="8"/><path d="M8.5 12h7M12 8.5v7"/>',
  balance:'<rect x="9.5" y="10" width="5" height="4" rx="1"/><path d="M14.5 12H17M17 8v8M9.5 12H7M7 8v8"/>',
  right:'<rect x="3.5" y="10" width="5" height="4" rx="1"/><path d="M8.5 12H12M12 6v12M12 6h4M12 12h4M12 18h4"/>',

svg.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

    view.k = k; view.x = (a.x + b.x) / 2 - r.left - wx * k; view.y = (a.y + b.y) / 2 - r.top - wy * k;

    case 'pan': view.x = drag.vx + e.clientX - drag.sx; view.y = drag.vy + e.clientY - drag.sy; applyView(); break;
    case 'move': {
      if (!drag.moved && !far(drag)) return;

        drag.snap = start && { start, targets:snapTargets(drag.ids) };

function endPointer(e){

    case 'mindmove':
      // 拖到空白处需要足够距离才变为自由主题，避免误操作

      break;
    case 'line': {
      const it = doc.items[d.id];
      if (!d.moved) { deleteIds([d.id]); }

const TOOLKEYS = { v:'select', h:'hand', m:'mind', n:'sticky', t:'text', r:'shape', l:'line', p:'pen', e:'eraser', i:'image' };

// 按方向寻找最近的主题（用于组织结构图、树形图、鱼骨图）
function navSpatial(n, key){
  const l = mindL[n.id], cx = l.x + l.w / 2, cy = l.y + l.h / 2;
  const dx = key === 'ArrowRight' ? 1 : key === 'ArrowLeft' ? -1 : 0, dy = key === 'ArrowDown' ? 1 : key === 'ArrowUp' ? -1 : 0;
  let best = null, bs = Infinity;
  subtreeIds(rootOf(n.id).id).forEach(id => {
    const q = mindL[id];
    if (!q || id === n.id) return;
    const vx = q.x + q.w / 2 - cx, vy = q.y + q.h / 2 - cy, along = vx * dx + vy * dy;
    if (along <= 4) return;
    const s = along + Math.abs(vx * dy - vy * dx) * 2.5;
    if (s < bs){ bs = s; best = id; }
  });
  return best;
}
function navMind(n, key){
  const l = mindL[n.id];
  if (!l) return;
  let target = null;
  if (!['balance', 'right', 'left'].includes(structOf(rootOf(n.id)))) target = navSpatial(n, key);
  else if (key === 'ArrowRight' || key === 'ArrowLeft'){
    const dir = key === 'ArrowRight' ? 1 : -1;
    if (!n.parent) target = n.children.find(c => mindL[c] && mindL[c].dir === dir);
    else if (l.dir === dir){
      if (n.collapsed && n.children.length){ toggleCollapse(n.id, false); renderNow(); }
      target = n.children[0];
    } else target = n.parent;
  } else {
    if (!n.parent) return;
    const sibs = doc.items[n.parent].children.filter(c => mindL[c] && mindL[c].dir === l.dir);
    target = sibs[sibs.indexOf(n.id) + (key === 'ArrowDown' ? 1 : -1)];
  }

}
document.addEventListener('keydown', e => {
  if (isTyping(e)){

    return;
  }

  if ($('#help').classList.contains('open')){ if (k === 'Escape' || k === '?') toggleHelp(false); return; }
  if (mod){
    const kl = k.toLowerCase();

    else if (kl === 'y'){ e.preventDefault(); redo(); }

    else if (k === '-'){ e.preventDefault(); zoomCenter(view.k / 1.25); }

function sw(color, g, cur){
  if (!color) return `<button class="sw auto ${!cur ? 'on' : ''}" data-act="color" data-g="${g}" data-v="" title="自动"></button>`;
  return `<button class="sw ${cur && cur.toLowerCase() === color.toLowerCase() ? 'on' : ''}" style="--c:${color}" data-act="color" data-g="${g}" data-v="${color}"></button>`;
}
const ib = (act, inner, title, on, v = '') => `<button class="ib ${on ? 'on' : ''}" data-act="${act}" data-v="${v}" title="${title}">${inner}</button>`;

    if (tool === 'pen'){
      h += grp(INK.map(c => sw(c, 'pen', penStyle.color)).join(''));
      h += grp([2, 3, 6, 10].map(w => ib('penw', `<span class="wdot" style="width:${w + 2}px;height:${w + 2}px"></span>`, '粗细 ' + w, penStyle.width === w, w)).join(''));
      h += grp(ib('penk', '笔', '钢笔', penStyle.kind === 'pen', 'pen') + ib('penk', '荧光', '荧光笔', penStyle.kind === 'marker', 'marker'));
      insp.innerHTML = h; insp.hidden = false; insp.dataset.mode = 'tool'; return;
    }
    insp.hidden = true; return;
  }
  insp.dataset.mode = 'sel';
  const selKey = [...selection].join();

  const types = new Set(items.map(i => i.type)), first = items[0], one = items.length === 1 ? first : null;
  const fillIt = items.find(i => i.type === 'sticky' || i.type === 'shape');
  const inkIt = items.find(i => ['text', 'pen', 'line', 'mind'].includes(i.type));
  if (fillIt) h += grp(FILL.map(c => sw(c, 'fill', fillIt.fill)).join(''));
  if (inkIt) h += grp(INK.map(c => sw(c, 'ink', inkIt.color)).join(''));
  const txt = items.find(i => TEXTUAL.has(i.type));
  if (txt) h += grp(ib('fs', 'A<small>−</small>', '缩小字号', false, -1) + ib('fs', 'A<b>+</b>', '放大字号', false, 1) + ib('bold', '<b>B</b>', '粗体', !!txt.bold));
  if (types.has('shape')){
    const cur = items.find(i => i.type === 'shape').shape;
    h += grp(Object.keys(SHAPE_IC).map(s => ib('shape', svgI(s, SHAPE_IC), '形状', cur === s, s)).join(''));
  }
  if (types.has('line')){
    const ln = items.find(i => i.type === 'line');

    h += grp(ib('lstyle', svgI('straight'), '直线', ls === 'straight', 'straight') + ib('lstyle', svgI('curve'), '曲线', ls === 'curve', 'curve')
      + ib('lstyle', svgI('elbow'), '折线', ls === 'elbow', 'elbow'));
    h += grp(ib('arrow', svgI('arrowNone'), '无箭头', !ln.arrow || ln.arrow === 'none', 'none') + ib('arrow', svgI('arrowEnd'), '单箭头', ln.arrow === 'end', 'end')
      + ib('arrow', svgI('arrowBoth'), '双箭头', ln.arrow === 'both', 'both') + ib('dash', svgI('dash'), '虚线', !!ln.dash)
      + (one ? ib('label', svgI('label'), '连线文字（双击连线或直接输入）') : ''));

// 在 macOS 本地 App 中运行时，数据存为 ~/Library/Application Support/Wubianji 下的文件
const NATIVE = (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.wbj) || null;

const memLS = {};

  catch { return { getItem:k => memLS[k] ?? null, setItem:(k, v) => { memLS[k] = String(v); }, removeItem:k => { delete memLS[k]; } }; }

const store = {
  async init(){
    if (NATIVE){
      try { nativeMeta = JSON.parse(await native('read', { name:'boards.json' }) || '[]'); } catch { nativeMeta = []; }
      return;
    }
    try {
      idb = await new Promise((res, rej) => {
        const r = indexedDB.open('wubianji', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('meta', { keyPath:'id' }); r.result.createObjectStore('data', { keyPath:'id' }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);

    } catch (err) { idb = null; console.warn('IndexedDB 不可用，改用 localStorage', err); }
  },
  async list(){

    try { return JSON.parse(LS.getItem('wbj.meta') || '[]'); } catch { return []; }
  },
  async get(id){
    if (NATIVE){ const t = await native('read', { name:id + '.json' }); return t ? JSON.parse(t) : null; }
    if (idb) return P(idb.transaction('data').objectStore('data').get(id));
    try { return JSON.parse(LS.getItem('wbj.data.' + id) || 'null'); } catch { return null; }
  },
  async put(meta, data){
    if (NATIVE){
      await native('write', { name:meta.id + '.json', text:JSON.stringify(data) });
      nativeMeta = nativeMeta.filter(m => m.id !== meta.id).concat([meta]);
      return native('write', { name:'boards.json', text:JSON.stringify(nativeMeta) });
    }
    if (idb){
      const t = idb.transaction(['meta', 'data'], 'readwrite');
      t.objectStore('meta').put(meta); t.objectStore('data').put(data);
      return new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); });
    }
    const l = (await this.list()).filter(m => m.id !== meta.id); l.push(meta);
    LS.setItem('wbj.meta', JSON.stringify(l)); LS.setItem('wbj.data.' + meta.id, JSON.stringify(data));
  },
  async del(id){
    if (NATIVE){
      nativeMeta = nativeMeta.filter(m => m.id !== id);
      await native('write', { name:'boards.json', text:JSON.stringify(nativeMeta) });
      return native('remove', { name:id + '.json' });
    }
    if (idb){
      const t = idb.transaction(['meta', 'data'], 'readwrite');
      t.objectStore('meta').delete(id); t.objectStore('data').delete(id);
      return new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); });
    }

  }
};

// 本地修改先直接作用在 doc 上，再与 shadow 比较，把有变化的元素整个发给服务器；

function makeShadow(d){
  return { items:new Map(Object.entries(d.items || {}).map(([k, v]) => [k, JSON.stringify(v)])), order:JSON.stringify(d.order || []),
    assets:new Set(Object.keys(d.assets || {})), name:d.name ?? null };

function schedulePush(){ if (collab.shadow && !collab.pushT) collab.pushT = setTimeout(pushChanges, 40); }
function pushChanges(){
  clearTimeout(collab.pushT); collab.pushT = 0;
  const sh = collab.shadow, ws = collab.ws;
  if (!sh || !ws || ws.readyState !== 1) return;
  const op = {}, ids = [];
  for (const id in doc.items){
    const j = JSON.stringify(doc.items[id]);
    if (sh.items.get(id) !== j){ (op.items ||= {})[id] = doc.items[id]; sh.items.set(id, j); ids.push(id); }
  }
  for (const id of [...sh.items.keys()]) if (!doc.items[id]){ (op.items ||= {})[id] = null; sh.items.delete(id); ids.push(id); }
  for (const a in doc.assets) if (!sh.assets.has(a)){ (op.assets ||= {})[a] = doc.assets[a]; sh.assets.add(a); }
  const oj = JSON.stringify(doc.order);
  if (oj !== sh.order){ op.order = doc.order; sh.order = oj; }
  if (board.name !== sh.name) op.name = sh.name = board.name;
  if (!Object.keys(op).length) return;

// 应用别人的修改。自己还没发出、或已发出但服务器尚未确认的元素以本地为准（服务器上最终也会是本地的版本）
function applyRemote(op, isFix){
  const sh = collab.shadow;
  if (!sh) return;
  const busy = new Set();
  if (!isFix) collab.inflight.forEach(o => o.ids.forEach(i => busy.add(i)));
  const prevOrder = JSON.stringify(doc.order);
  const orderUnsent = [...collab.inflight.values()].some(o => o.order) || prevOrder !== sh.order;
  const applied = [];
  for (const [id, v] of Object.entries(op.items || {})){
    if (busy.has(id)) continue;
    const unsent = (doc.items[id] ? JSON.stringify(doc.items[id]) : undefined) !== sh.items.get(id);
    if (v) sh.items.set(id, JSON.stringify(v)); else sh.items.delete(id);
    if (unsent) continue;
    if (v) doc.items[id] = v; else delete doc.items[id];
    applied.push(id);
  }
  if (op.assets) for (const [k, v] of Object.entries(op.assets)){ doc.assets[k] = v; sh.assets.add(k); }
  if (typeof op.name === 'string'){
    sh.name = board.name = op.name;
    if (document.activeElement !== $('#title')) $('#title').value = board.name;
    syncTitle();
  }
  if (op.order){
    const remote = op.order;
    if (orderUnsent){ const s = new Set(doc.order); doc.order = doc.order.filter(isTop).concat(remote.filter(id => !s.has(id) && isTop(id))); }
    else { const s = new Set(remote); doc.order = [...new Set(remote.filter(isTop).concat(doc.order.filter(id => !s.has(id) && isTop(id) && !sh.items.has(id))))]; }
    sh.order = JSON.stringify(remote);
  } else if (applied.length) doc.order = doc.order.filter(id => doc.items[id]);
  // 部分应用后思维导图的子主题列表可能指向已删除的主题
  for (const it of Object.values(doc.items))
    if (it.type === 'mind' && it.children.some(c => !doc.items[c])) it.children = it.children.filter(c => doc.items[c]);
  // 正在进行的拖动 / 编辑的“改动前”快照也跟上别人的修改，免得撤销时把别人的修改一起撤掉
  const rebase = s => {
    if (s == null) return s;
    const o = JSON.parse(s);
    applied.forEach(id => { if (doc.items[id]) o.items[id] = doc.items[id]; else delete o.items[id]; });
    if (JSON.stringify(o.order) === prevOrder) o.order = doc.order;
    return JSON.stringify({ items:o.items, order:o.order });
  };
  if (drag && drag.before) drag.before = rebase(drag.before);
  if (editBefore) editBefore = rebase(editBefore);
  if (editing && !doc.items[editing]) finishEdit();
  if (drag && drag.id && !doc.items[drag.id]) drag = null;
  selection = new Set([...selection].filter(id => doc.items[id]));
  clearTimeout(saveTimer); saveTimer = setTimeout(saveBoard, 800);
  render();
}
function onWelcome(m){

  const d = m.doc, base = collab.shadow || (collab.seed ? makeShadow({}) : null);

    for (const id in doc.items) if (base.items.get(id) !== JSON.stringify(doc.items[id])) mine.items[id] = doc.items[id];

  try { ws = new WebSocket(url); } catch (err) { collab.status = 'offline'; updateCollabUI(); return; }
  collab.ws = ws;
  ws.onopen = () => { if (gen === collab.gen) collab.pingT = setInterval(() => { if (ws.readyState === 1) ws.send('{"type":"ping"}'); }, 20000); };
  ws.onmessage = e => { if (gen === collab.gen) try { onCollabMsg(JSON.parse(e.data)); } catch (err) { console.error(err); } };
  ws.onclose = () => {
    if (gen !== collab.gen) return;
    clearInterval(collab.pingT); collab.ws = null;
    // 没确认的修改不知道服务器有没有收到，重连后重新发送
    const sh = collab.shadow;
    if (sh) collab.inflight.forEach(o => { o.ids.forEach(i => sh.items.set(i, '\0')); if (o.order) sh.order = ''; });
    collab.inflight.clear(); collab.peers.clear();
    collab.status = 'offline'; updateCollabUI(); renderSel();
    collab.retryT = setTimeout(() => { if (gen === collab.gen) collabConnect(); }, Math.min(10000, 800 * 2 ** collab.retryN++));
  };
}
// keep = 断线重连，保留 shadow 以便合并断线期间的修改
function collabClose(keep){
  collab.gen++;
  clearTimeout(collab.retryT); clearInterval(collab.pingT); clearTimeout(collab.pushT); collab.pushT = 0;
  if (collab.ws){ collab.ws.onclose = null; try { collab.ws.close(); } catch {} collab.ws = null; }
  collab.peers.clear(); collab.inflight.clear();
  if (!keep){ collab.shadow = null; collab.status = 'off'; collab.retryN = 0; collab.seed = false; }
  renderCursors();
}
function schedulePresence(){ if (collab.ws && !collab.presT) collab.presT = setTimeout(() => { collab.presT = 0; sendPresence(); }, 50); }
function sendPresence(force){
  const ws = collab.ws;
  if (!ws || ws.readyState !== 1 || !collab.shadow) return;
  const msg = JSON.stringify({ type:'presence', cursor:myCursor, sel:[...selection].slice(0, 300), editing });
  if (!force && msg === collab.lastPres) return;
  collab.lastPres = msg; ws.send(msg);
}

svg.addEventListener('pointerleave', () => { myCursor = null; schedulePresence(); });
function peersSVG(k){
  let s = '';
  for (const p of collab.peers.values()){
    const ids = new Set([...(p.sel || []), ...(p.editing ? [p.editing] : [])]);
    for (const id of ids){
      const b = doc.items[id] && bboxOf(id);
      if (!b) continue;
      s += `<rect x="${f(b.x - 6 / k)}" y="${f(b.y - 6 / k)}" width="${f(b.w + 12 / k)}" height="${f(b.h + 12 / k)}" rx="${f(7 / k)}" fill="none" stroke="${esc(p.color)}" stroke-width="${f(2 / k)}"${p.editing === id ? '' : ` stroke-dasharray="${f(5 / k)} ${f(3 / k)}"`}/>`;
    }
  }
  return s;
}
const curEls = new Map();
function renderCursors(){
  const box = $('#cursors'), seen = new Set();
  for (const p of collab.peers.values()){
    if (!p.cursor) continue;
    seen.add(p.id);
    let el = curEls.get(p.id);
    if (!el){ el = document.createElement('div'); el.className = 'cur'; box.appendChild(el); curEls.set(p.id, el); }
    const h = `<svg viewBox="0 0 18 18"><path d="M2.5 1.5l12.5 6.2-5.5 1.6-2.6 5.4z" fill="${esc(p.color)}" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg><span style="background:${esc(p.color)}">${esc(p.name)}${p.editing ? ' ✎' : ''}</span>`;
    if (el.dataset.h !== h){ el.innerHTML = h; el.dataset.h = h; }
    el.style.transform = `translate(${f(p.cursor.x * view.k + view.x)}px,${f(p.cursor.y * view.k + view.y)}px)`;
  }
  for (const [id, el] of curEls) if (!seen.has(id)){ el.remove(); curEls.delete(id); }
}

function normServer(s){

  if (!/^https?:\/\//i.test(s)) s = 'http://' + s;
  try { return new URL(s).origin; } catch { return null; }
}
async function checkServer(server){

}

function parseInvite(text){
  try {
    const u = new URL(text.trim()), m = u.hash.match(/room=([A-Za-z0-9_-]{4,40})/);
    return m ? { server:u.origin, room:m[1] } : null;
  } catch { return null; }
}
async function joinRoom(server, room){
  if (editing) finishEdit();
  const metas = await store.list();
  const m = metas.find(x => x.room === room && x.server === server) || metas.find(x => x.room === room);
  if (m){
    if (m.id !== board.id) await loadBoard(m.id);
    else if (!collab.ws) collabConnect();
    return;
  }
  await newBoard('协作画板');

}

async function download(blob, name){
  if (NATIVE){
    try {

      if (path) toast('已导出 ' + path.split('/').pop());

  }
  const a = document.createElement('a');

async function exportPNG(){
  const r = exportSVG();
  if (!r) return toast('画板是空的');
  const scale = Math.min(2, 12000 / Math.max(r.w, r.h));
  const img = await loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(r.svg));
  const cv = document.createElement('canvas');
  cv.width = Math.ceil(r.w * scale); cv.height = Math.ceil(r.h * scale);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  cv.toBlob(bl => bl ? download(bl, safeName() + '.png') : toast('导出失败'), 'image/png');
}
function exportMarkdown(){
  const roots = selection.size ? [...topIds([...selection])] : doc.order;
  const minds = roots.filter(id => doc.items[id] && doc.items[id].type === 'mind');
  if (!minds.length) return toast('没有可导出的思维导图');
  const out = [];
  minds.forEach(rid => {
    const walk = (id, d) => {
      const n = doc.items[id], t = (n.text || '').replace(/\n+/g, ' ');
      out.push(d === 0 ? `# ${t}\n` : `${'  '.repeat(d - 1)}- ${t}`);
      n.children.forEach(c => walk(c, d + 1));
    };
    walk(rid, 0); out.push('');
  });
  download(new Blob([out.join('\n')], { type:'text/markdown' }), safeName() + '.md');
}

window.addEventListener('resize', () => { renderSel(); positionInspector(); positionEditor(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readTheme(); renderNow(); });
window.addEventListener('beforeunload', () => { if (editing) finishEdit(); if (saveTimer) saveBoard(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && saveTimer) saveBoard(); });
const appReady = (async function init(){
  readTheme(); updateUndoBtns(); setTool('select'); updateCollabUI();
  await store.init();
  const metas = await store.list();
  let last = null;
  try { last = NATIVE ? await native('read', { name:'last.txt' }) : LS.getItem('wbj.last'); } catch {}
  const invite = canHash() && parseInvite(location.href);
  if (invite) await joinRoom(invite.server, invite.room);
  else if (metas.length){
    const id = metas.find(m => m.id === last) ? last : metas.sort((a, b) => b.updated - a.updated)[0].id;
    await loadBoard(id);
  } else await newBoard('欢迎使用', welcomeContent(), true);
})();

// ============ 本地 App 接口（菜单命令、在访达中打开文件、退出前保存） ============
if (NATIVE){
  const typing = () => { const a = document.activeElement; return a && /^(INPUT|TEXTAREA)$/.test(a.tagName); };
  const CMDS = {
    newBoard:() => newBoard(), open:openFilePicker, save:() => saveToFile(false), saveAs:() => saveToFile(true),
    exportPNG, exportSVG:exportSVGFile, exportMD:exportMarkdown, insertImage:() => setTool('image'),
    undo:() => typing() ? document.execCommand('undo') : undo(), redo:() => typing() ? document.execCommand('redo') : redo(),
    duplicate, deleteSel:() => { if (!typing()) deleteSelection(); },
    zoomIn:() => zoomCenter(view.k * 1.25), zoomOut:() => zoomCenter(view.k / 1.25), zoom100:() => zoomCenter(1), fit:() => fitView(),
    sidebar:() => $('#sideBtn').click(), help:() => toggleHelp(true), share:openShare
  };
  window.wbjCommand = cmd => { if (CMDS[cmd]) CMDS[cmd](); };
  window.wbjOpenText = async (name, text, path) => { await appReady; if (await openText(name, text)) fileHandle = path; };
  window.wbjFlush = async () => { await appReady; if (editing) finishEdit(); if (saveTimer) await saveBoard(); return true; };
  document.addEventListener('contextmenu', e => { if (!isTyping(e)) e.preventDefault(); });
}
</script>
</body>
